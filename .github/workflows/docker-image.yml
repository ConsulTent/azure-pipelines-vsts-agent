name: Docker Image

on:
  schedule:
    - cron: '17 4 1 * *' # 1st of month, 04:17 UTC (off-peak minute; top-of-hour is congested)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: "22.04"
            base: "ubuntu:22.04"
            rolling: "ubuntu-22.04"
          - variant: "24.04"
            base: "ubuntu:24.04"
            rolling: "ubuntu-24.04"
          - variant: "26.04"
            base: "ubuntu:26.04"
            rolling: "ubuntu-26.04"
            is_latest: true
          - variant: "dhi-debian13"
            base: "dhi.io/debian-base:trixie" # Docker Hardened Images base; needs dhi.io login
            rolling: "dhi-debian13"
    steps:
      - name: Checkout (path context required so the sed below reaches the build)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Inject git version
        run: |
          GITVER="$(git describe --always --long)"
          sed -i "s/XXGITVERXX/${GITVER}/g" ubuntu/Dockerfile

      - name: Compute tags
        id: tags
        run: |
          {
            echo "tags<<EOF"
            echo "consultent/azure-pipelines-vsts-agent:${{ matrix.rolling }}"
            echo "consultent/azure-pipelines-vsts-agent:${{ matrix.variant }}-${{ github.run_number }}-${{ github.run_id }}"
            if [ "${{ matrix.is_latest }}" = "true" ]; then
              echo "consultent/azure-pipelines-vsts-agent:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PAT }}

      - name: Login to dhi.io (hardened base registry; same Docker account)
        if: matrix.variant == 'dhi-debian13'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PAT }}

      - name: Build & push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ubuntu # path context; the default Git context would ignore the sed above
          build-args: |
            VARIANT=${{ matrix.variant }}
            BASE_IMAGE=${{ matrix.base }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}

  update-readme:
    needs: build-push
    if: always() # the status board updates every run, success or failure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # job-scoped; the build legs stay contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Login to Docker Hub (for the monthly version tag push)
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PAT }}

      - name: Update README tables
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        id: tables
        run: |
          python3 .github/update-variants-table.py \
            --run ${{ github.run_id }} \
            --number ${{ github.run_number }} \
            --date "$(date -u +%F)" | tee tables.log
          VT="$(sed -n 's/^version_tag: //p' tables.log)"
          if [ -n "$VT" ] && [ "$VT" != "(none)" ]; then
            echo "version_tag=$VT" >> "$GITHUB_OUTPUT"
          fi

      - name: Push monthly version tag (manifest-only re-tag of ubuntu-26.04)
        if: steps.tables.outputs.version_tag != ''
        env:
          VERSION_TAG: ${{ steps.tables.outputs.version_tag }}
        run: |
          set -euo pipefail
          case "$VERSION_TAG" in
            [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9]*.*-*) ;; # <year>-<month>-<az>-<pwsh>
            *) echo "refusing unexpected version tag: $VERSION_TAG"; exit 1 ;;
          esac
          docker pull consultent/azure-pipelines-vsts-agent:ubuntu-26.04
          docker tag consultent/azure-pipelines-vsts-agent:ubuntu-26.04 \
                     "consultent/azure-pipelines-vsts-agent:$VERSION_TAG"
          docker push "consultent/azure-pipelines-vsts-agent:$VERSION_TAG"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "docs: update variant status (run ${{ github.run_number }})"
          git push
